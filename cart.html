<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart & Checkout | AuraGadget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #ec4899; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 50%, #f5f3ff 100%); color: #1e293b; min-height: 100vh; }
        h1, h2, h3, .font-brand { font-family: 'Outfit', sans-serif; }

        .unshaped-card {
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px -5px rgba(99, 102, 241, 0.1);
        }
        .unshaped-media {
            border-radius: 20px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="py-4 px-6 md:px-12 bg-white/70 backdrop-blur-md sticky top-0 z-50 border-b border-indigo-100 flex items-center justify-between shadow-sm">
        <a href="index.html" class="text-2xl font-black tracking-tight font-brand flex items-center gap-2">
            <span class="w-4 h-4 rounded-full bg-gradient-to-r from-indigo-500 to-pink-500 animate-pulse"></span>
            AURA<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-600">GADGET</span>
        </a>
        <div class="flex items-center gap-4">
            <a href="index.html" class="px-4 py-2 bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold text-xs rounded-full hover:bg-indigo-100 transition shadow-sm">🏠 Continue Shopping</a>
            <a href="profile.html" class="px-4 py-2 bg-pink-50 border border-pink-200 text-pink-700 font-bold text-xs rounded-full hover:bg-pink-100 transition shadow-sm">👤 My Profile</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-6 py-10">
        <h1 class="text-3xl md:text-4xl font-black font-brand text-gray-900 mb-8 text-center">Your Shopping Cart 🛒</h1>

        <div id="cart-content-area" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Cart Items List -->
            <div class="lg:col-span-2 space-y-4" id="cart-items-container">
                <!-- Dynamically Populated -->
            </div>

            <!-- Right: Order Summary & Checkout Trigger -->
            <div class="lg:col-span-1">
                <div class="unshaped-card p-6 sticky top-24 space-y-4">
                    <h2 class="text-xl font-black font-brand text-gray-900">Order Summary</h2>
                    <div class="space-y-2 text-xs text-gray-600 border-b border-indigo-50 pb-4">
                        <div class="flex justify-between">
                            <span>Subtotal</span>
                            <span id="summary-subtotal" class="font-bold">₹0</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Shipping</span>
                            <span class="text-green-600 font-bold">FREE</span>
                        </div>
                    </div>
                    <div class="flex justify-between text-base font-black text-gray-900">
                        <span>Total Amount</span>
                        <span id="summary-total" class="text-pink-600">₹0</span>
                    </div>

                    <button id="proceed-checkout-btn" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-pink-600 text-white font-extrabold text-xs uppercase tracking-widest rounded-full shadow-lg shadow-indigo-200 hover:opacity-95 transition">
                        Proceed to Checkout 🚀
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- CHECKOUT MODAL (Address & Payment Selection) -->
    <div id="checkout-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="unshaped-card max-w-xl w-full p-6 md:p-8 space-y-6 relative max-h-[90vh] overflow-y-auto">
            <button id="close-modal-btn" class="absolute top-6 right-6 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-700 hover:bg-pink-100 hover:text-pink-600 transition font-bold">✕</button>
            
            <h2 class="text-2xl font-black font-brand text-gray-900">Checkout & Payment 💳</h2>

            <!-- 1. Select Delivery Address -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-700">Select Delivery Address</label>
                    <a href="profile.html" class="text-xs text-pink-600 font-bold hover:underline">+ Add New Address</a>
                </div>
                <div id="checkout-address-list" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <!-- Loaded dynamically -->
                </div>
            </div>

            <!-- 2. Select Payment Method -->
            <div class="space-y-3 pt-2 border-t border-indigo-50">
                <label class="block text-xs font-bold uppercase tracking-wider text-indigo-700">Choose Way of Payment</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="p-3.5 rounded-2xl border border-indigo-200 bg-white/70 flex items-center gap-3 cursor-pointer hover:border-indigo-500 transition">
                        <input type="radio" name="payment-method" value="COD" checked class="text-indigo-600">
                        <div>
                            <p class="font-bold text-xs text-gray-900">Cash on Delivery (COD)</p>
                            <p class="text-[10px] text-gray-400">Pay when order arrives</p>
                        </div>
                    </label>
                    <label class="p-3.5 rounded-2xl border border-indigo-200 bg-white/70 flex items-center gap-3 cursor-pointer hover:border-indigo-500 transition">
                        <input type="radio" name="payment-method" value="UPI / QR" class="text-indigo-600">
                        <div>
                            <p class="font-bold text-xs text-gray-900">UPI / QR Code</p>
                            <p class="text-[10px] text-gray-400">GPay, PhonePe, Paytm</p>
                        </div>
                    </label>
                    <label class="p-3.5 rounded-2xl border border-indigo-200 bg-white/70 flex items-center gap-3 cursor-pointer hover:border-indigo-500 transition">
                        <input type="radio" name="payment-method" value="Credit/Debit Card" class="text-indigo-600">
                        <div>
                            <p class="font-bold text-xs text-gray-900">Credit / Debit Card</p>
                            <p class="text-[10px] text-gray-400">Visa, MasterCard</p>
                        </div>
                    </label>
                    <label class="p-3.5 rounded-2xl border border-indigo-200 bg-white/70 flex items-center gap-3 cursor-pointer hover:border-indigo-500 transition">
                        <input type="radio" name="payment-method" value="Net Banking" class="text-indigo-600">
                        <div>
                            <p class="font-bold text-xs text-gray-900">Net Banking</p>
                            <p class="text-[10px] text-gray-400">All major banks</p>
                        </div>
                    </label>
                </div>
            </div>

            <button id="place-order-btn" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-pink-600 text-white font-extrabold text-xs uppercase tracking-widest rounded-2xl shadow-lg shadow-indigo-200 hover:opacity-95 transition">
                Place Secure Order 🛍️
            </button>
        </div>
    </div>

    <!-- Firebase SDK & Cart Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBW-jJt5BzRPldFaazaAausuxZGHuVtoNw",
            authDomain: "auragadgets-c3a7c.firebaseapp.com",
            projectId: "auragadgets-c3a7c",
            storageBucket: "auragadgets-c3a7c.firebasestorage.app",
            messagingSenderId: "119527057995",
            appId: "1:119527057995:web:5f3b2173af91861d1cbbce",
            measurementId: "G-54CD81QGGR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", function() {
            loadCartItems();

            // Button Event Listeners attached safely
            document.getElementById('proceed-checkout-btn').addEventListener('click', proceedToCheckout);
            document.getElementById('close-modal-btn').addEventListener('click', closeCheckoutModal);
            document.getElementById('place-order-btn').addEventListener('click', placeOrder);
        });

        function loadCartItems() {
            let cart = JSON.parse(localStorage.getItem('aura_cart')) || [];
            let container = document.getElementById('cart-items-container');
            let subtotalElem = document.getElementById('summary-subtotal');
            let totalElem = document.getElementById('summary-total');

            container.innerHTML = '';
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="unshaped-card p-12 text-center space-y-4">
                        <p class="text-gray-400 font-bold text-sm">Your cart is currently empty 🛒</p>
                        <a href="index.html" class="inline-block px-6 py-3 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow">Explore Gadgets</a>
                    </div>
                `;
                subtotalElem.textContent = '₹0';
                totalElem.textContent = '₹0';
                return;
            }

            let subtotal = 0;
            cart.forEach((item, index) => {
                let itemPriceNum = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
                let qty = item.quantity || 1;
                subtotal += itemPriceNum * qty;

                container.innerHTML += `
                    <div class="unshaped-card p-4 md:p-6 flex items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <div class="w-20 h-20 unshaped-media bg-slate-100 flex-shrink-0">
                                <img src="${item.image}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <span class="text-[9px] font-extrabold text-indigo-600 uppercase tracking-widest">${item.category || 'Gadget'}</span>
                                <h3 class="font-black text-gray-900 text-base font-brand">${item.name}</h3>
                                <p class="text-pink-600 font-bold text-sm mt-1">${item.price}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center border border-indigo-200 rounded-xl bg-white overflow-hidden">
                                <button onclick="updateQty(${index}, -1)" class="px-2.5 py-1 text-xs font-bold text-gray-600 hover:bg-indigo-50">-</button>
                                <span class="px-3 text-xs font-black">${qty}</span>
                                <button onclick="updateQty(${index}, 1)" class="px-2.5 py-1 text-xs font-bold text-gray-600 hover:bg-indigo-50">+</button>
                            </div>
                            <button onclick="removeItem(${index})" class="text-red-500 hover:bg-red-50 p-2 rounded-xl transition text-xs font-bold">🗑️</button>
                        </div>
                    </div>
                `;
            });

            subtotalElem.textContent = '₹' + subtotal.toLocaleString();
            totalElem.textContent = '₹' + subtotal.toLocaleString();
        }

        window.updateQty = function(index, change) {
            let cart = JSON.parse(localStorage.getItem('aura_cart')) || [];
            cart[index].quantity = (cart[index].quantity || 1) + change;
            if (cart[index].quantity <= 0) cart[index].quantity = 1;
            localStorage.setItem('aura_cart', JSON.stringify(cart));
            loadCartItems();
        }

        window.removeItem = function(index) {
            let cart = JSON.parse(localStorage.getItem('aura_cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('aura_cart', JSON.stringify(cart));
            loadCartItems();
        }

        function proceedToCheckout() {
            let cart = JSON.parse(localStorage.getItem('aura_cart')) || [];
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            let addresses = JSON.parse(localStorage.getItem('aura_user_addresses')) || [];
            if (addresses.length === 0) {
                alert('No delivery address found! Please add your delivery address first.');
                window.location.href = 'profile.html';
                return;
            }

            let addrContainer = document.getElementById('checkout-address-list');
            addrContainer.innerHTML = '';
            addresses.forEach((addr, idx) => {
                addrContainer.innerHTML += `
                    <label class="p-3 rounded-xl border border-indigo-200 bg-white/70 flex items-start gap-3 cursor-pointer hover:border-indigo-500 transition">
                        <input type="radio" name="selected-address" value="${idx}" ${idx === 0 ? 'checked' : ''} class="mt-1 text-indigo-600">
                        <div class="text-xs">
                            <p class="font-bold text-gray-900">${addr.name} (${addr.phone})</p>
                            <p class="text-gray-600 mt-0.5">${addr.street}, ${addr.locality}, ${addr.city} - ${addr.pin}</p>
                        </div>
                    </label>
                `;
            });

            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        async function placeOrder() {
            let cart = JSON.parse(localStorage.getItem('aura_cart')) || [];
            let addresses = JSON.parse(localStorage.getItem('aura_user_addresses')) || [];
            let selectedAddrInput = document.querySelector('input[name="selected-address"]:checked');
            
            if (!selectedAddrInput) {
                alert('Please select a delivery address.');
                return;
            }

            let chosenAddress = addresses[selectedAddrInput.value];
            let paymentMethodInput = document.querySelector('input[name="payment-method"]:checked');
            let paymentMethod = paymentMethodInput ? paymentMethodInput.value : 'COD';

            let itemsSummary = cart.map(i => `${i.name} (x${i.quantity || 1})`).join(', ');
            let totalAmount = document.getElementById('summary-total').textContent;

            // Generate or get unique device identifier so orders stay isolated per device
            let deviceId = localStorage.getItem('aura_device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 9);
                localStorage.setItem('aura_device_id', deviceId);
            }

            let orderData = {
                customerName: chosenAddress.name,
                customerPhone: chosenAddress.phone,
                shippingAddress: `${chosenAddress.street}, ${chosenAddress.locality}, ${chosenAddress.city} - ${chosenAddress.pin}`,
                itemsSummary: itemsSummary,
                total: totalAmount,
                paymentMethod: paymentMethod,
                status: 'Dispatched',
                deviceId: deviceId, // <--- Device ID added here successfully
                timestamp: Date.now(),
                returnRequested: false
            };

            try {
                let btn = document.getElementById('place-order-btn');
                btn.textContent = "Processing Order...";
                btn.disabled = true;

                await addDoc(collection(db, "orders"), orderData);
                localStorage.removeItem('aura_cart'); // Clear cart
                alert('Order Placed Successfully! 🎉 Admin will process it shortly.');
                window.location.href = 'profile.html';
            } catch (err) {
                alert('Error placing order: ' + err.message);
                let btn = document.getElementById('place-order-btn');
                btn.textContent = "Place Secure Order 🛍️";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
