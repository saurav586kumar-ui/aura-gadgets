<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraGadget ⚡ | Horizontal Row Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff5f7; color: #1e293b; overflow-x: hidden; min-height: 100vh; }
        h1, h2, h3, .font-brand { font-family: 'Outfit', sans-serif; }

        /* CLEAN LIGHT RECTANGULAR CARD STYLES */
        .clean-card {
            background: #ffffff;
            border: 1px solid #ffd1dc;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(244, 63, 94, 0.03), 0 2px 4px -1px rgba(244, 63, 94, 0.02);
            transition: all 0.3s ease;
        }
        .clean-card:hover {
            transform: translateY(-4px);
            border-color: #f43f5e;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.1);
        }

        /* HORIZONTAL ROW SCROLL CONTAINER FOR PRODUCTS */
        .product-row-scroll {
            display: flex;
            overflow-x: auto;
            gap: 1rem;
            padding-bottom: 1rem;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .product-row-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .product-row-scroll::-webkit-scrollbar-track {
            background: #fff1f2;
            border-radius: 4px;
        }
        .product-row-scroll::-webkit-scrollbar-thumb {
            background: #fbcfe8;
            border-radius: 4px;
        }
        .product-row-item {
            flex: 0 0 calc(33.333% - 0.75rem); /* Mobile & Laptop pe row mein fit karne ke liye */
            min-width: 140px;
            scroll-snap-align: start;
        }
        @media (min-width: 768px) {
            .product-row-item {
                flex: 0 0 calc(25% - 0.75rem);
            }
        }

        /* BANNER SLIDER TRANSITION */
        .banner-slide {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .banner-slide.active {
            display: flex;
            opacity: 1;
        }
    </style>
</head>
<body class="selection:bg-rose-500 selection:text-white">

    <!-- HEADER / NAVIGATION -->
    <header class="py-3 px-4 md:px-12 bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-rose-100 flex items-center justify-between shadow-sm">
        <a href="index.html" class="text-xl md:text-2xl font-black tracking-tight font-brand flex items-center gap-2 text-slate-900">
            <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
            AURA<span class="text-rose-500">GADGET</span>
        </a>

        <div class="flex items-center gap-2 md:gap-3">
            <a href="cart.html" class="px-3.5 py-2 bg-rose-50 border border-rose-100 text-rose-700 font-semibold text-xs rounded-lg hover:bg-rose-100 transition flex items-center gap-1.5">
                🛒 <span class="hidden sm:inline">Bag</span> <span id="cart-count" class="bg-rose-500 text-white px-1.5 py-0.2 rounded-full text-[10px]">0</span>
            </a>
            <a href="profile.html" class="px-3.5 py-2 bg-rose-50 border border-rose-100 text-rose-700 font-semibold text-xs rounded-lg hover:bg-rose-100 transition flex items-center gap-1.5">
                👤 <span class="hidden sm:inline">Account</span>
            </a>
        </div>
    </header>

    <!-- 1. AUTO-CHANGING BANNER (Dynamic Products) -->
    <section class="w-full bg-gradient-to-r from-rose-900 via-rose-950 to-slate-950 text-white border-b border-rose-900/50 overflow-hidden relative">
        <div id="banner-container" class="relative w-full max-w-7xl mx-auto min-h-[240px] md:min-h-[320px] flex items-center">
            <div class="w-full text-center py-12 text-rose-300 text-xs">Loading featured items...</div>
        </div>

        <div id="banner-dots" class="absolute bottom-3 left-0 right-0 flex justify-center gap-2 z-10"></div>
    </section>

    <!-- 2. PRODUCT CATEGORIES (Rectangular Boxes) -->
    <section class="py-6 px-4 md:px-12 max-w-7xl mx-auto">
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg md:text-2xl font-black text-slate-900 font-brand">Shop By Categories</h2>
        </div>
        <div id="category-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
            <!-- Dynamically Loaded Categories -->
        </div>
    </section>

    <!-- 3. FEATURED PRODUCTS ROW (Horizontal Row / Slide Layout) -->
    <section class="py-4 px-4 md:px-12 max-w-7xl mx-auto pb-20">
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg md:text-2xl font-black text-slate-900 font-brand">Featured Products</h2>
            <a href="all-products.html" class="text-xs font-bold text-rose-600 hover:text-rose-700 transition flex items-center gap-1">
                View All &rarr;
            </a>
        </div>

        <!-- Horizontal Row Container -->
        <div id="product-row" class="product-row-scroll">
            <!-- Dynamically Loaded Products in Row -->
        </div>
    </section>

    <!-- PRODUCT DETAIL POPUP MODAL -->
    <div id="product-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto transition-opacity duration-300 opacity-0">
        <div class="bg-white border border-rose-100 w-full max-w-2xl rounded-2xl relative shadow-2xl p-6 md:p-8 transform scale-95 transition-transform duration-300" id="modal-container">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 bg-rose-50 rounded-full flex items-center justify-center text-rose-700 hover:bg-rose-100 transition font-bold border border-rose-200">
                ✕
            </button>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                <div class="space-y-3">
                    <div class="w-full aspect-square rounded-xl bg-rose-50/50 border border-rose-100 overflow-hidden">
                        <img id="modal-main-img" src="" class="w-full h-full object-cover" alt="Product">
                    </div>
                    <div id="modal-thumbnails" class="flex gap-2 overflow-x-auto pb-1"></div>
                </div>

                <div class="flex flex-col justify-between">
                    <div>
                        <span id="modal-category" class="px-2.5 py-1 bg-rose-50 text-rose-700 text-[10px] font-bold rounded-md uppercase tracking-wider border border-rose-200"></span>
                        <h2 id="modal-title" class="text-xl md:text-2xl font-black text-slate-900 mt-2 font-brand"></h2>
                        
                        <div class="flex items-center gap-3 my-3">
                            <span id="modal-price" class="text-xl font-black text-rose-600"></span>
                            <span id="modal-actual-price" class="text-xs text-slate-400 line-through font-semibold"></span>
                        </div>

                        <p id="modal-desc" class="text-slate-600 text-xs md:text-sm leading-relaxed mb-6"></p>
                    </div>

                    <button onclick="addToCartFromModal()" class="w-full py-3 bg-rose-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl hover:bg-rose-700 transition shadow-lg shadow-rose-200">
                        Add To Bag 🛍️
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-8 border-t border-rose-100 text-slate-500 text-xs bg-white">
        <p>&copy; 2026 AURA GADGET. All Rights Reserved.</p>
    </footer>

    <!-- FIREBASE & APP LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBW-jJt5BzRPldFaazaAausuxZGHuVtoNw",
            authDomain: "auragadgets-c3a7c.firebaseapp.com",
            projectId: "auragadgets-c3a7c",
            storageBucket: "auragadgets-c3a7c.firebasestorage.app",
            messagingSenderId: "119527057995",
            appId: "1:119527057995:web:5f3b2173af91861d1cbbce",
            measurementId: "G-54CD81QGGR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentActiveModalProduct = null;
        let slideIndex = 0;
        let slideInterval;
        let bannerProductsCount = 0;

        document.addEventListener("DOMContentLoaded", async function() {
            updateCartBadge();
            let products = [];
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
            } catch (error) {
                products = JSON.parse(localStorage.getItem('aura_products')) || [];
            }

            if (products.length === 0) {
                products = JSON.parse(localStorage.getItem('aura_products')) || [];
            }

            renderStore(products);
        });

        function initDynamicBanner(products) {
            const bannerContainer = document.getElementById('banner-container');
            const dotsContainer = document.getElementById('banner-dots');
            
            bannerContainer.innerHTML = '';
            dotsContainer.innerHTML = '';

            const sliderItems = products.slice(0, 4);
            bannerProductsCount = sliderItems.length;

            if (bannerProductsCount === 0) {
                bannerContainer.innerHTML = `<div class="w-full text-center py-10 text-rose-300 text-xs">No banner products available</div>`;
                return;
            }

            sliderItems.forEach((prod, idx) => {
                const activeClass = idx === 0 ? 'active' : '';
                bannerContainer.innerHTML += `
                    <div class="banner-slide ${activeClass} w-full flex-col md:flex-row items-center justify-between px-6 md:px-12 py-8 gap-6">
                        <div class="max-w-xl text-center md:text-left">
                            <span class="px-3 py-1 bg-rose-500/20 text-rose-300 text-[11px] font-bold rounded-md uppercase tracking-wider border border-rose-500/30">${prod.category || 'Featured'}</span>
                            <h1 class="text-xl md:text-3xl font-black text-white mt-3 font-brand line-clamp-1">${prod.name}</h1>
                            <p class="text-rose-200 text-xs md:text-sm mt-2 line-clamp-2">${prod.description || 'Grab the best deal now with massive discounts.'}</p>
                            <div class="mt-4 flex items-center justify-center md:justify-start gap-3">
                                <span class="text-lg font-black text-rose-400">${prod.price}</span>
                                <button onclick='openProductModalIndex(${idx})' class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs rounded-lg transition shadow-md">View Product ⚡</button>
                            </div>
                        </div>
                        <div class="w-32 h-32 md:w-44 md:h-44 bg-rose-950 rounded-xl border border-rose-700/50 flex items-center justify-center p-1.5 flex-shrink-0 shadow-xl overflow-hidden">
                            <img src="${prod.image}" class="w-full h-full object-cover rounded-lg" alt="${prod.name}">
                        </div>
                    </div>
                `;

                dotsContainer.innerHTML += `
                    <button onclick="currentSlide(${idx})" class="w-2.5 h-2.5 rounded-full bg-rose-400/50 transition-all dot-indicator" id="dot-${idx}"></button>
                `;
            });

            startAutoBanner();
        }

        function startAutoBanner() {
            if (bannerProductsCount <= 1) return;
            if (slideInterval) clearInterval(slideInterval);
            
            slideInterval = setInterval(() => {
                slideIndex = (slideIndex + 1) % bannerProductsCount;
                showSlide(slideIndex);
            }, 4000);
        }

        window.currentSlide = function(n) {
            clearInterval(slideInterval);
            slideIndex = n;
            showSlide(slideIndex);
            startAutoBanner();
        }

        function showSlide(n) {
            let slides = document.getElementsByClassName('banner-slide');
            let dots = document.getElementsByClassName('dot-indicator');
            if(slides.length === 0) return;
            
            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove('active');
                if(dots[i]) {
                    dots[i].classList.remove('bg-rose-500', 'w-6');
                    dots[i].classList.add('bg-rose-400/50');
                }
            }
            if(slides[n]) slides[n].classList.add('active');
            if(dots[n]) {
                dots[n].classList.remove('bg-rose-400/50');
                dots[n].classList.add('bg-rose-500', 'w-6');
            }
        }

        function updateCartBadge() {
            let cart = JSON.parse(localStorage.getItem('aura_cart')) || [];
            let totalCount = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            document.getElementById('cart-count').textContent = totalCount;
        }

        function renderStore(products) {
            window.currentProductsList = products;
            initDynamicBanner(products);

            // 1. Render Categories
            let categories = {};
            products.forEach(p => {
                let cat = p.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(p);
            });

            let catContainer = document.getElementById('category-grid');
            catContainer.innerHTML = '';

            if (Object.keys(categories).length === 0) {
                catContainer.innerHTML = `<div class="text-slate-400 text-xs text-center py-4 col-span-full">No categories available.</div>`;
            }

            for (let catName in categories) {
                let count = categories[catName].length;
                let sampleImg = categories[catName][0].image;

                catContainer.innerHTML += `
                    <div onclick="window.location.href='category.html?name=${encodeURIComponent(catName)}'" class="clean-card p-3 cursor-pointer flex items-center gap-2.5 group">
                        <div class="w-10 h-10 rounded-lg bg-rose-50 flex-shrink-0 border border-rose-100 overflow-hidden">
                            <img src="${sampleImg}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        </div>
                        <div class="overflow-hidden">
                            <h3 class="text-xs font-bold text-slate-800 group-hover:text-rose-600 transition truncate">${catName}</h3>
                            <p class="text-[9px] text-slate-500 mt-0.5">${count} items</p>
                        </div>
                    </div>
                `;
            }

            // 2. Render Products in Horizontal Row (3+ items per row visible, scrollable)
            let productRow = document.getElementById('product-row');
            productRow.innerHTML = '';

            if (products.length === 0) {
                productRow.innerHTML = `<div class="w-full text-center py-12 text-slate-400 text-xs font-semibold">No products added yet. Add items in admin panel.</div>`;
                return;
            }

            products.forEach((prod, idx) => {
                productRow.innerHTML += `
                    <div onclick='openProductModalIndex(${idx})' class="product-row-item clean-card p-3 cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="relative w-full h-32 md:h-44 rounded-lg bg-rose-50/50 mb-2 border border-rose-100 overflow-hidden">
                                <img src="${prod.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="${prod.name}">
                                <span class="absolute top-2 left-2 px-1.5 py-0.5 bg-white/90 backdrop-blur text-rose-700 text-[8px] font-bold rounded uppercase tracking-wider border border-rose-200 shadow-sm">${prod.category}</span>
                            </div>
                            <h4 class="font-bold text-slate-800 text-xs md:text-sm line-clamp-1 group-hover:text-rose-600 transition">${prod.name}</h4>
                            <p class="text-slate-500 text-[10px] md:text-xs line-clamp-1 mt-0.5 leading-relaxed">${prod.description}</p>
                        </div>
                        
                        <div class="mt-3 pt-2 border-t border-rose-100/60 flex items-center justify-between">
                            <div class="flex items-center gap-1.5">
                                <span class="text-xs md:text-sm font-black text-rose-600">${prod.price}</span>
                                <span class="text-[9px] text-slate-400 line-through font-semibold">${prod.actualPrice || ''}</span>
                            </div>
                            <span class="w-6 h-6 rounded-lg bg-rose-50 text-rose-600 flex items-center justify-center text-[10px] group-hover:bg-rose-600 group-hover:text-white transition font-bold">+</span>
                        </div>
                    </div>
                `;
            });
        }

        window.openProductModalIndex = function(index) {
            let prod = window.currentProductsList[index];
            currentActiveModalProduct = prod;

            document.getElementById('modal-category').textContent = prod.category;
            document.getElementById('modal-title').textContent = prod.name;
            document.getElementById('modal-price').textContent = prod.price;
            document.getElementById('modal-actual-price').textContent = prod.actualPrice || '';
            document.getElementById('modal-desc').textContent = prod.description || 'No description provided.';
            
            let mainImg = document.getElementById('modal-main-img');
            mainImg.src = prod.image;

            let thumbContainer = document.getElementById('modal-thumbnails');
            thumbContainer.innerHTML = '';
            
            let allImages = [prod.image];
            if (prod.extraImages) {
                try {
                    let parsedExtra = JSON.parse(prod.extraImages);
                    if (Array.isArray(parsedExtra)) allImages = allImages.concat(parsedExtra);
                } catch(e) {}
            }

            allImages.forEach(imgSrc => {
                thumbContainer.innerHTML += `
                    <div class="w-12 h-12 rounded-lg bg-rose-50 cursor-pointer border border-rose-100 hover:border-rose-500 transition flex-shrink-0 overflow-hidden">
                        <img src="${imgSrc}" onclick="document.getElementById('modal-main-img').src='${imgSrc}'" class="w-full h-full object-cover">
                    </div>
                `;
            });

            let modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modal-container').classList.remove('scale-95');
            }, 10);
        }

        window.closeModal = function() {
            let modal = document.getElementById('product-modal');
            modal.classList.add('opacity-0');
            document.getElementById('modal-container').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 250);
        }

        window.addToCartFromModal = function() {
            if (!currentActiveModalProduct) return;
            let cart = JSON.parse(localStorage.getItem('aura_cart')) || [];
            let existingItem = cart.find(item => item.name === currentActiveModalProduct.name);
            
            if (existingItem) {
                existingItem.quantity = (existingItem.quantity || 1) + 1;
            } else {
                cart.push({ ...currentActiveModalProduct, quantity: 1 });
            }

            localStorage.setItem('aura_cart', JSON.stringify(cart));
            updateCartBadge();
            alert('Item added to bag successfully! 🛍️');
            closeModal();
        }
    </script>
</body>
</html>
