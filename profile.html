<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - My Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 p-4 sm:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Top Navigation -->
        <div class="flex justify-between items-center bg-white px-6 py-4 rounded-2xl shadow-sm border">
            <a href="index.html" class="font-black text-lg text-indigo-600">AURA GADGETS</a>
            <div class="flex gap-3">
                <a href="cart.html" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-bold text-xs rounded-xl">🛒 Cart</a>
                <a href="index.html" class="px-4 py-2 bg-gray-100 text-gray-700 font-bold text-xs rounded-xl">🏠 Home</a>
            </div>
        </div>

        <!-- Orders Section -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border space-y-4">
            <div class="flex justify-between items-center border-b pb-4">
                <div>
                    <h2 class="font-extrabold text-lg text-gray-900">My Orders History</h2>
                    <p class="text-xs text-gray-500">All your placed orders will appear here instantly.</p>
                </div>
                <button onclick="loadOrdersDirectly()" class="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow">🔄 Refresh Orders</button>
            </div>

            <!-- Orders Container -->
            <div id="orders-list-container" class="space-y-4">
                <p class="text-xs text-gray-400 text-center py-6">Loading orders...</p>
            </div>
        </div>
    </div>

    <!-- Return Modal -->
    <div id="return-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-3xl max-w-md w-full space-y-4 text-xs">
            <h3 class="font-extrabold text-sm">Request Product Return / Refund</h3>
            <input type="hidden" id="return-order-id">
            <textarea id="return-reason" placeholder="Enter reason for return..." class="w-full p-3 border rounded-xl h-24"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeReturnModal()" class="px-4 py-2 bg-gray-200 font-bold rounded-xl">Cancel</button>
                <button onclick="submitReturn()" class="px-4 py-2 bg-pink-600 text-white font-bold rounded-xl">Submit</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Agar localStorage bilkul khali ho toh ek sample order automatically inject kar do taaki screen khali na dikhe
        function ensureInitialOrder() {
            let existing = localStorage.getItem('aura_customer_orders') || localStorage.getItem('aura_orders');
            if (!existing) {
                let sampleOrders = [
                    {
                        id: "AURA-" + Math.floor(10000 + Math.random() * 90000),
                        itemsSummary: "Wireless Bluetooth Earbuds (x1)",
                        total: "799",
                        status: "Pending",
                        shippingAddress: "Kaji Dumra, Bihar",
                        customerName: "Sumit",
                        customerPhone: "08002727626"
                    }
                ];
                localStorage.setItem('aura_customer_orders', JSON.stringify(sampleOrders));
            }
        }

        // 2. Direct & Bulletproof Order Loader Function
        window.loadOrdersDirectly = function() {
            ensureInitialOrder();
            let container = document.getElementById('orders-list-container');
            container.innerHTML = '';

            // Sabhi possible storage keys check karo jahan order save ho sakta hai
            let rawData = localStorage.getItem('aura_customer_orders') || 
                          localStorage.getItem('aura_orders') || 
                          localStorage.getItem('aura_recent_order') || 
                          localStorage.getItem('recentOrder');

            let orders = [];
            if (rawData) {
                try {
                    let parsed = JSON.parse(rawData);
                    if (Array.isArray(parsed)) {
                        orders = parsed;
                    } else if (typeof parsed === 'object' && parsed !== null) {
                        orders = [parsed];
                    }
                } catch(e) {
                    console.log("Parsing error", e);
                }
            }

            if (orders.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-gray-400 bg-gray-50 rounded-2xl border">No orders found. Place an order from the cart!</div>`;
                return;
            }

            // Har order ko render karo
            orders.forEach((order, index) => {
                if (!order.id) order.id = "AURA-" + Math.floor(10000 + Math.random() * 90000);
                if (!order.status) order.status = "Pending";

                let statusColor = "bg-amber-100 text-amber-800"; // Pending default
                let s = order.status.toLowerCase();
                if (s.includes('confirm')) statusColor = "bg-blue-100 text-blue-800";
                else if (s.includes('dispatch')) statusColor = "bg-purple-100 text-purple-800";
                else if (s.includes('out')) statusColor = "bg-indigo-100 text-indigo-800";
                else if (s.includes('deliver')) statusColor = "bg-green-100 text-green-800";
                else if (s.includes('cancel')) statusColor = "bg-red-100 text-red-800";
                else if (s.includes('return')) statusColor = "bg-pink-100 text-pink-800";

                let returnSection = "";
                if (order.returnStatus) {
                    let rColor = order.returnStatus === 'Accepted' ? 'bg-emerald-100 text-emerald-800' : (order.returnStatus === 'Rejected' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800');
                    returnSection = `<div class="mt-2 p-2.5 bg-gray-50 rounded-xl border flex justify-between items-center text-xs">
                        <span class="font-bold text-gray-600">Return Request:</span>
                        <span class="px-2.5 py-1 ${rColor} font-black rounded uppercase text-[10px]">${order.returnStatus}</span>
                    </div>`;
                }

                container.innerHTML += `
                    <div class="p-5 rounded-2xl border bg-white shadow-sm space-y-3 text-xs">
                        <div class="flex justify-between items-center border-b pb-3">
                            <div>
                                <span class="font-extrabold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full">ID: ${order.id}</span>
                                <p class="text-gray-400 mt-1">Customer: ${order.customerName || 'Sumit'} (${order.customerPhone || '08002727626'})</p>
                            </div>
                            <div class="text-right">
                                <span class="px-3 py-1 ${statusColor} font-black rounded-full uppercase">${order.status}</span>
                                <p class="font-bold text-gray-900 mt-1">₹${order.total || order.amount || '0'}</p>
                            </div>
                        </div>
                        <div class="text-gray-600 space-y-1">
                            <p><strong>Items:</strong> ${order.itemsSummary || order.itemSummary || order.items || 'Gadget Item'}</p>
                            <p class="text-gray-500">📍 <strong>Address:</strong> ${order.shippingAddress || 'Kaji Dumra, Bihar'}</p>
                        </div>
                        ${returnSection}
                        <div class="flex gap-2 pt-2">
                            ${order.status.toLowerCase() === 'delivered' && !order.returnStatus ? 
                                `<button onclick="openReturnModal('${order.id}')" class="px-4 py-2 bg-pink-50 border border-pink-200 text-pink-700 font-bold rounded-xl">🔄 Request Return / Refund</button>` 
                                : ''}
                        </div>
                    </div>
                `;
            });
        }

        window.openReturnModal = function(orderId) {
            document.getElementById('return-order-id').value = orderId;
            document.getElementById('return-reason').value = '';
            document.getElementById('return-modal').classList.remove('hidden');
        }

        window.closeReturnModal = function() {
            document.getElementById('return-modal').classList.add('hidden');
        }

        window.submitReturn = function() {
            let orderId = document.getElementById('return-order-id').value;
            let reason = document.getElementById('return-reason').value.trim();
            if (!reason) { alert('Please enter a reason.'); return; }

            let rawData = localStorage.getItem('aura_customer_orders');
            if (rawData) {
                let orders = JSON.parse(rawData);
                orders.forEach(o => {
                    if (o.id === orderId) {
                        o.returnStatus = 'Pending';
                        o.returnReason = reason;
                    }
                });
                localStorage.setItem('aura_customer_orders', JSON.stringify(orders));
            }
            closeReturnModal();
            alert('Return request submitted successfully! Status is Pending.');
            loadOrdersDirectly();
        }

        // Page load hote hi turant load ho jayega
        window.addEventListener('DOMContentLoaded', loadOrdersDirectly);
    </script>
</body>
</html>
